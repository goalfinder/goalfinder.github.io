<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="{{ page.description }}" />

		<!-- Base URL for JavaScript -->
		<script>
			window.siteBaseUrl = "{{ site.baseurl | default: '' }}";
		</script>

		<link rel="stylesheet" href="{{ site.baseurl }}/styles/documentation.css" />
		<link rel="stylesheet" href="{{ site.baseurl }}/tools/markdown-converter/markdown-styles.css" />
		<link rel="icon" href="{{ site.baseurl }}/assets/img/logos/goalfinder/logo-shadow.png" type="image/png" />

		<script>
			(function () {
				const savedTheme = localStorage.getItem("theme");
				if (savedTheme === "dark") {
					document.documentElement.classList.add("dark-mode");
				}
				function updateToggleButton() {
					const toggleButton = document.getElementById("lightDarkToggle");
					if (toggleButton && savedTheme === "dark") {
						const toggleIcon = toggleButton.querySelector(".icon");
						const baseUrl = window.siteBaseUrl || "";
						const lightSrc = baseUrl ? `${baseUrl}/assets/img/svg/light.svg` : "/assets/img/svg/light.svg";
						toggleIcon.src = lightSrc;
					}
				}
				if (document.readyState === "loading") {
					document.addEventListener("DOMContentLoaded", updateToggleButton);
				} else {
					updateToggleButton();
				}
			})();

			function toggleSources(id) {
				const element = document.getElementById(id);
				if (element) {
					element.classList.toggle("expanded");
				}
			}
		</script>

		<script type="module" src="{{ site.baseurl }}/scripts/documentation.js"></script>

		<title data-i18n="doc-page-title-short">Documentation</title>
	</head>

	<body>
		<header>
			<div class="header-logo">
				<button id="topicToggle" class="topic-toggle" aria-label="Toggle sidebar" aria-expanded="false">
					<img class="topic-toggle-icon" src="{{ site.baseurl }}/assets/img/svg/hamburger.svg" alt="menu" id="header-logo" />
				</button>
				<img src="{{ site.baseurl }}/assets/img/logos/goalfinder/logo-shadow.png" class="header-image" id="header-icon" alt="Logo" />
				<p class="header-text" data-i18n="doc-page-title"></p>
				<div class="header-controls">
					<div class="header-search-bar">
						<img class="icon search-icon" src="{{ site.baseurl }}/assets/img/svg/search.svg" alt="search-icon" />
						<input type="text" onfocus="searchbarFocus()" onblur="searchbarBlur()" oninput="searchbarSearch()" id="searchInput" placeholder="Search documentation..." data-i18n="search" />
						<div id="searchPopup" class="search-popup">
							<ul class="search-results">
								<li class="search-no-results" data-i18n="search-hint">No results...</li>
							</ul>
						</div>
					</div>
					<button id="lightDarkToggle" onclick="lightDarkModeToggle()" aria-label="Toggle light/dark mode">
						<img class="icon" src="{{ site.baseurl }}/assets/img/svg/dark.svg" alt="Theme Toggle Icon" />
					</button>
					<button id="lang-toggle">
						<span class="icon" id="lang-toggle-text">DE</span>
					</button>
				</div>
			</div>
		</header>

		<div class="side-line"></div>

		<!-- Section Navigation Bar
		<nav class="section-nav" id="sectionNav">
			 Populated dynamically by JS based on content structure sections 
		</nav> -->

		<main>
			<div class="content-container">
				<div class="topic-selector">
					<button id="topicClose" class="topic-close" aria-label="Close sidebar">
						<img src="{{ site.baseurl }}/assets/img/svg/cancel.svg" alt="close" />
					</button>
					<!-- Loading of topics will use class "topic-category" for headers of categories -->
				</div>
				<div class="display-window">
					<div id="markdown-container">
						<!-- Loading of MarkDown content will be placed here -->
					</div>
				</div>
				<div class="right-panel">
					<button class="copy-button" id="copyButton" onclick="copyButtonTrigger()" aria-label="Copy content">
						<img class="icon" src="{{ site.baseurl }}/assets/img/svg/copy.svg" alt="Copy Icon"/>
					</button>
					<div id="right-panel-header"></div>
				</div>
			</div>
		</main>
		<footer>
			<a href="{{ site.baseurl }}/credits" target="_blank" data-i18n="credits">Credits</a>
		</footer>

		<!-- Overlay for sliding sidebar on small screens -->
		<div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>
	</body>
</html>
