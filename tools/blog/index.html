<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalFinder - Home</title>

    <!-- Base URL for JavaScript (standalone testing) -->
    <script>
        window.siteBaseUrl = "../..";
    </script>

    <link rel="stylesheet" href="blog.css">

    <script>
        (function () {
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme === "dark") {
                document.documentElement.classList.add("dark-mode");
            }
        })();
    </script>

    <style>
        /* Page-specific styles */
        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .page-header h1 {
            font-size: 3rem;
            margin-bottom: 16px;
            color: var(--blog-text);
        }

        .page-header p {
            font-size: 1.2rem;
            color: var(--blog-text-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        .header-actions {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
            align-items: start;
        }

        .main-content {
            background-color: var(--blog-card-bg);
            border-radius: 12px;
            padding: 40px;
            box-shadow: var(--blog-shadow);
        }

        .main-content h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .main-content p {
            color: var(--blog-text-muted);
            line-height: 1.8;
            margin-bottom: 16px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .sidebar-section h3 {
            font-size: 1rem;
            margin-bottom: 16px;
            color: var(--blog-text);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-link {
            display: block;
            padding: 12px 16px;
            background-color: var(--blog-card-bg);
            border-radius: 8px;
            text-decoration: none;
            color: var(--blog-text);
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: var(--blog-shadow);
        }

        .nav-link:hover {
            background-color: var(--blog-primary);
            color: white;
        }

        @media (max-width: 900px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                order: -1;
            }

            .latest-post-widget {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .page-header h1 {
                font-size: 2rem;
            }

            .main-content {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Header -->
        <header class="page-header">
            <h1>GoalFinder</h1>
            <p>Your journey to achievement starts here. Explore our blog for tips, updates, and insights.</p>
            <div class="header-actions">
                <button id="lang-toggle" class="lang-toggle">
                    <span id="lang-toggle-text">DE</span>
                </button>
            </div>
        </header>

        <!-- Content Grid -->
        <div class="content-grid">
            <!-- Main Content -->
            <main class="main-content">
                <h2 data-i18n="blog-welcome-title">Welcome</h2>
                <p data-i18n="blog-welcome-text">
                    Welcome to GoalFinder! This is your central hub for information about the project. 
                    Stay tuned for updates and new content.
                </p>
            </main>

            <!-- Sidebar -->
            <aside class="sidebar">
                <!-- Latest Post Widget -->
                <section class="sidebar-section">
                    <div id="latest-post-widget" class="latest-post-widget">
                        <!-- Latest post will be dynamically inserted here -->
                        <div class="widget-content" style="text-align: center; padding: 40px;">
                            <p style="color: var(--blog-text-muted);">Loading latest post...</p>
                        </div>
                    </div>
                </section>

                <!-- Navigation Links -->
                <section class="sidebar-section">
                    <h3 data-i18n="blog-quick-links">Quick Links</h3>
                    <nav class="nav-links">
                        <a href="blog.html" class="nav-link" data-i18n="blog-view-all">View All Blog Posts</a>
                    </nav>
                </section>
            </aside>
        </div>
    </div>

    <script type="module">
        import { loadLang, getCurrentLang, setCurrentLang, getTranslations } from '../../scripts/i18n.js';

        let currentLang = getCurrentLang();
        const baseUrl = window.siteBaseUrl || "";

        /**
         * Get translation from i18n
         */
        function t(key) {
            const translations = getTranslations();
            return translations[key] || key;
        }

        /**
         * Get localized value from post data
         */
        function getLocalizedValue(post, key) {
            const langKey = `${key}-${currentLang}`;
            return post[langKey] || post[key] || '';
        }

        /**
         * Load and display the latest blog post widget
         */
        async function loadLatestPost() {
            const widgetContainer = document.getElementById('latest-post-widget');
            
            try {
                // Load the posts manifest
                const manifestResponse = await fetch(`${baseUrl}/tools/blog/content/posts.json`);
                if (!manifestResponse.ok) {
                    throw new Error('Failed to load posts manifest');
                }
                const manifest = await manifestResponse.json();

                if (manifest.posts.length === 0) {
                    widgetContainer.innerHTML = `
                        <div class="widget-content" style="text-align: center; padding: 40px;">
                            <p style="color: var(--blog-text-muted);">${t('blog-no-posts')}</p>
                        </div>
                    `;
                    return;
                }

                // Load all posts metadata to find the latest one
                const postPromises = manifest.posts.map(async (postRef) => {
                    const postPath = `${baseUrl}/tools/blog/content/${postRef.folder}/${postRef.id}.json`;
                    const response = await fetch(postPath);
                    if (!response.ok) return null;
                    const postData = await response.json();
                    return {
                        ...postData,
                        id: postRef.id,
                        folder: postRef.folder,
                        basePath: `${baseUrl}/tools/blog/content/${postRef.folder}/`
                    };
                });

                const posts = (await Promise.all(postPromises)).filter(p => p !== null);

                // Sort by date (newest first) and get the latest
                const parseDate = (dateStr) => {
                    const [day, month, year] = dateStr.split('.').map(Number);
                    return new Date(year, month - 1, day);
                };

                posts.sort((a, b) => parseDate(b.date) - parseDate(a.date));
                const latestPost = posts[0];

                if (!latestPost) {
                    widgetContainer.innerHTML = `
                        <div class="widget-content" style="text-align: center; padding: 40px;">
                            <p style="color: var(--blog-text-muted);">${t('blog-no-posts')}</p>
                        </div>
                    `;
                    return;
                }

                // Format date
                const formatDate = (dateStr) => {
                    const date = parseDate(dateStr);
                    const locale = currentLang === 'de' ? 'de-DE' : 'en-US';
                    return date.toLocaleDateString(locale, {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                };

                // Build thumbnail path
                const thumbnailPath = latestPost['thumbnail-path']
                    ? `${latestPost.basePath}${latestPost['thumbnail-path'].replace('./', '')}`
                    : '';
                    
                const title = getLocalizedValue(latestPost, 'title');
                const shortDesc = getLocalizedValue(latestPost, 'short-desc');

                // Render the widget
                widgetContainer.innerHTML = `
                    <div class="widget-header">
                        <h3>${t('blog-latest')}</h3>
                    </div>
                    ${thumbnailPath ? `
                        <div class="widget-thumbnail">
                            <img src="${thumbnailPath}" alt="${title}" loading="lazy">
                        </div>
                    ` : `
                        <div class="widget-thumbnail widget-thumbnail-placeholder">
                            <span>📝</span>
                        </div>
                    `}
                    <div class="widget-content">
                        <h4 class="widget-title">${title}</h4>
                        <p class="widget-date">${formatDate(latestPost.date)}</p>
                        <p class="widget-description">${shortDesc}</p>
                        <a href="blog.html#${latestPost.id}" class="widget-link">${t('blog-read-more')}</a>
                    </div>
                `;

            } catch (error) {
                console.error('Error loading latest post:', error);
                widgetContainer.innerHTML = `
                    <div class="widget-content" style="text-align: center; padding: 40px;">
                        <p style="color: var(--blog-text-muted);">${t('blog-load-error')}</p>
                    </div>
                `;
            }
        }

        /**
         * Switch language
         */
        function switchLang() {
            const newLang = currentLang === 'de' ? 'en' : 'de';
            setCurrentLang(newLang);
            loadLang(newLang, () => {
                currentLang = newLang;
                const langText = document.getElementById('lang-toggle-text');
                if (langText) {
                    langText.textContent = newLang.toUpperCase();
                }
                loadLatestPost();
            });
        }

        // Initialize
        async function init() {
            await new Promise((resolve) => {
                loadLang(currentLang, resolve);
            });
            
            const langButton = document.getElementById('lang-toggle');
            if (langButton) {
                langButton.addEventListener('click', switchLang);
            }
            
            loadLatestPost();
        }
        
        init();
    </script>
</body>
</html>
